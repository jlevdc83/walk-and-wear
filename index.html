<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- user-scalable=no removed: it blocked pinch zoom, which is an accessibility failure
       and bought nothing here. viewport-fit=cover is kept for the notch. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c1730" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Walk &amp; Wear">
  <meta name="description" content="What to wear, what to bring, and when to walk the dog.">
  <title>Walk &amp; Wear</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="phase-night">

  <!-- The material refracts what sits behind it, so there has to be something behind it
       worth bending. These are the light sources the glass picks up. -->
  <div class="sky" aria-hidden="true">
    <span class="lum lum1"></span>
    <span class="lum lum2"></span>
    <span class="lum lum3"></span>
  </div>

  <div class="app">

    <header class="bar">
      <div class="clockGroup">
        <div class="clock" id="timeNow">--:--</div>
        <!-- Hidden unless the Screen Wake Lock API is available. Off by default: keeping
             a screen lit is a decision with a battery cost, not something to assume. -->
        <button class="awakeBtn hidden" id="awakeBtn" type="button"
                aria-pressed="false" aria-label="Keep screen awake">Keep awake</button>
      </div>
      <div class="barMeta">
        <!-- Tappable: the only way to change location once one is set. -->
        <button class="place" id="zipMeta" type="button" aria-label="Change location">Location —</button>
        <div class="updatedRow">
          <span class="updated" id="updatedLine">Updated —</span>
          <a class="widgetsBtn" id="widgetsBtn" href="admin.html" aria-label="Settings">⚙</a>
        </div>
      </div>
    </header>

    <!-- Shown only when location is unavailable. Replaces window.prompt(), which iOS
         suppresses in standalone PWA mode, leaving no way to recover. -->
    <section class="card glass locate hidden" id="locateCard">
      <h2 class="cardLabel">Location needed</h2>
      <p class="locateNote" id="locateNote">Allow location, or enter a ZIP code to continue.</p>
      <form class="locateForm" id="locateForm">
        <input
          id="zipInput"
          class="zipInput"
          type="text"
          inputmode="numeric"
          autocomplete="postal-code"
          pattern="[0-9]{5}"
          maxlength="5"
          placeholder="20001"
          aria-label="ZIP code"
          required />
        <button class="zipSubmit" type="submit">Use ZIP</button>
      </form>
      <div class="locateActions">
        <button class="linkBtn" type="button" id="retryLocation">Use my location</button>
        <!-- Only shown when the card was opened on purpose, not after a failure —
             there is nothing to go back to if location genuinely failed. -->
        <button class="linkBtn hidden" type="button" id="cancelLocate">Cancel</button>
      </div>
    </section>

    <main class="wgrid" id="decisions">

      <section class="w w-medium glass decision wear" id="wearCard" data-widget="wear">
        <h2 class="cardLabel">Wear</h2>
        <p class="verdict" id="jacketValue">—</p>
        <p class="support" id="wearValue">—</p>
        <p class="aside" id="wearSub">—</p>
        <p class="tip" id="wearDetailLine"></p>
      </section>

      <section class="w w-large glass decision walk" id="walkCard" data-widget="walk">
        <h2 class="cardLabel">Dog walk</h2>
        <p class="verdict" id="walkPrimary">—</p>
        <p class="support" id="walkSecondary">—</p>
        <p class="aside" id="walkTertiary">—</p>
        <!-- The next 10 hours at a glance, so a walk can be planned rather than
             just accepted or refused. -->
        <div class="outlook" id="outlook" aria-label="Walk conditions over the next ten hours"></div>
        <!-- Filled when an hour is tapped. The strip is the densest thing on screen
             and was the only part that couldn't explain itself. -->
        <p class="hourDetail hidden" id="hourDetail" aria-live="polite"></p>
      </section>

      <section class="w w-small glass chip hidden" id="bringCard" data-widget="bring">
          <span class="chipLabel">Bring</span>
          <span class="chipValue" id="bringValue">—</span>
          <span class="chipSub" id="bringSub">—</span>
        </section>

      <section class="w w-small glass chip hidden" id="protectCard" data-widget="protect">
          <span class="chipLabel">Protect</span>
          <span class="chipValue" id="protectValue">—</span>
          <span class="chipSub" id="protectSub">—</span>
        </section>


      <!-- Compact widgets. Each is off by default except where noted; the admin page
           decides which appear in which context. -->
      <section class="w w-small glass mini widgetOff" data-widget="pollen">
          <span class="miniHead"><span class="miniLabel">Pollen</span><span class="miniIcon" id="pollenIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="pollenValue">—</span>
          <span class="miniSub" id="pollenSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="airquality">
          <span class="miniHead"><span class="miniLabel">Air quality</span><span class="miniIcon" id="aqIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="aqValue">—</span>
          <span class="miniSub" id="aqSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="humidity">
          <span class="miniHead"><span class="miniLabel">Humidity</span><span class="miniIcon" id="humIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="humValue">—</span>
          <span class="miniSub" id="humSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="sun">
          <span class="miniHead"><span class="miniLabel">Sun</span><span class="miniIcon" id="sunIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="sunValue">—</span>
          <span class="miniSub" id="sunSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="tomorrow">
          <span class="miniHead"><span class="miniLabel">Tomorrow</span><span class="miniIcon" id="tomIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="tomValue">—</span>
          <span class="miniSub" id="tomSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="lock">
          <span class="miniHead"><span class="miniLabel">Front door</span><span class="miniIcon" id="lockIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="lockValue">—</span>
          <span class="miniSub" id="lockSub">—</span>
          <span class="pill hidden" id="lockBatt"></span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="indoorair">
          <span class="miniHead"><span class="miniLabel">Indoor air</span><span class="miniIcon" id="inAirIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="inAirValue">—</span>
          <span class="miniSub" id="inAirSub">—</span>
        </section>
      <section class="w w-small glass mini widgetOff" data-widget="indoorhum">
          <span class="miniHead"><span class="miniLabel">Indoor humidity</span><span class="miniIcon" id="inHumIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="inHumValue">—</span>
          <span class="miniSub" id="inHumSub">—</span>
        </section>
      <section class="w w-large glass mini widgetOff" data-widget="batteries">
          <span class="miniHead"><span class="miniLabel">Batteries</span><span class="miniIcon" id="battIcon" aria-hidden="true"></span></span>
          <span class="miniValue" id="battValue">—</span>
          <span class="miniSub" id="battSub">—</span>
          <div class="battRows" id="battRows"></div>
        </section>


      <footer class="w w-medium glass weather" id="weather" data-widget="weather">
      <div class="wxHead">
        <span class="temp" id="tempNow">—°</span>
        <span class="feels" id="feelsNow">feels —°</span>
        <span class="badge" id="modeBadge">·</span>
        <span class="condition" id="conditionLine">—</span>
      </div>
      <div class="ambient" id="ambientLine">—</div>
      <div class="stats" id="stats"></div>
    </footer>

    </main>

  </div>

  <div class="buildMeta" id="buildMeta">v79</div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
